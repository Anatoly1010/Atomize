[DEFAULT]
name = Bruker Field Controller via Xepr API
type = ssh
timeout = 5000

[GPIB]
board = 0
address = 0

[SERIAL]
address =
baudrate = 9600
databits = 8
startbits = 1
stopbits = one
parity = none
read_termination = n
write_termination = n
flow_control = 0

[MODBUS]
mode =
slave_address =

[ETHERNET]
# SSH login of the user that runs Xepr; key login needed (ssh-copy-id)
address = xuser@192.168.3.4

[SPECIFIC]
# Python 2 on the Xepr PC and the folder with XeprAPI.py
remote_python = python
api_path = /opt/Bruker/xepr/XeprAPI
# Xepr process id; empty = the only Xepr with the API enabled
xepr_pid =
# CW experiment used to set the field, created on first use
experiment = AtomizeField
# field range for the test run; Xepr's own limits are used once connected
min_field = -25
max_field = 15500
# wait in s after each field change (setting the field does not wait for the magnet)
field_wait = 0
